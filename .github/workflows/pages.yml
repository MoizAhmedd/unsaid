# https://moizahmedd.github.io/unsaid/: site/public plus /install (scripts/install.sh).
name: pages
on:
  push:
    branches: [main]
    paths: ["site/public/**", "scripts/install.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Add the installer
        run: |
          mkdir -p _site && cp -R site/public/. _site/
          cp scripts/install.sh _site/install
          cp scripts/install.sh _site/install.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
